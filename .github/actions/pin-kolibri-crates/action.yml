name: Pin iOS Rust crates
description: >
  Lock libc at 0.2.189 for kolibri and komet_crypto so backtrace can resolve
  the Apple mobile dyld symbols. Run after flutter pub get.

runs:
  using: composite
  steps:
    - name: Lock kolibri crates
      shell: bash
      run: |
        set -euo pipefail
        version=$(awk '/^  kolibri:$/ {found=1} found && /^    version:/ {gsub(/"/, "", $2); print $2; exit}' pubspec.lock)
        manifest="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev/kolibri-$version/rust/Cargo.toml"
        for crate_manifest in "$manifest" native/komet_crypto/rust/Cargo.toml; do
          cargo generate-lockfile --manifest-path "$crate_manifest"
          cargo update --manifest-path "$crate_manifest" -p libc --precise 0.2.189
          grep -A1 '^name = "libc"' "$(dirname "$crate_manifest")/Cargo.lock"
        done
